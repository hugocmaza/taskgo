<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis tareas</ion-title>
    <ion-buttons slot="end">
      <ion-toggle (ionChange)="toggleDarkMode($event)" aria-label="Modo oscuro"></ion-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (usandoCache()) {
    <ion-chip color="warning" class="ion-margin">
      <ion-icon name="cloud-offline-outline"></ion-icon>
      <ion-label>Sin conexión — mostrando datos guardados</ion-label>
    </ion-chip>
    <ion-button fill="clear" size="small" (click)="cargarTareas()">Reintentar</ion-button>
  }

  @if (loading()) {
    <div class="ion-text-center ion-padding">
      <ion-spinner></ion-spinner>
    </div>
  }
  @if (error()) {
    <ion-text color="danger"><p class="ion-padding">{{ error() }}</p></ion-text>
  }

  <ion-list>
    @for (task of tasks(); track task.id) {
      <ion-item-sliding>
        <ion-item button (click)="abrirDetalle(task)">
          <ion-checkbox slot="start" [checked]="task.done"></ion-checkbox>
          <ion-label>
            <h2>{{ task.title }}</h2>
            <p>Vence: {{ task.dueDate }}</p>
          </ion-label>
          <ion-badge slot="end" [color]="colorFor(task.priority)">{{ task.priority }}</ion-badge>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="success" (click)="completar(task)">
            <ion-icon slot="icon-only" name="checkmark"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="eliminar(task)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/nueva">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
