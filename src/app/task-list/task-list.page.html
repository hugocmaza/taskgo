<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis tareas</ion-title>
    <ion-buttons slot="end">
      <ion-toggle (ionChange)="toggleDarkMode($event)" aria-label="Modo oscuro"></ion-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (loading()) {
    <div class="ion-text-center ion-padding">
      <ion-spinner></ion-spinner>
    </div>
  }
  @if (error()) {
    <ion-text color="danger"><p class="ion-padding">{{ error() }}</p></ion-text>
  }

  <ion-list>
    @for (task of tasks(); track task.id) {
      <ion-item>
        <ion-checkbox slot="start" [checked]="task.done"></ion-checkbox>
        <ion-label>
          <h2>{{ task.title }}</h2>
          <p>Vence: {{ task.dueDate }}</p>
        </ion-label>
        <ion-badge slot="end" [color]="colorFor(task.priority)">{{ task.priority }}</ion-badge>
      </ion-item>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/nueva">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
