# Entorno de desarrollo TaskGo Lite con Docker Compose.
# Levanta dos servicios: la app (ng serve) y la API falsa (json-server).
#
#   docker compose up --build
#
# Luego abrir en el navegador del HOST:
#   - App: http://localhost:8100
#   - API: http://localhost:3000/tasks
services:
  # Servidor de desarrollo de la app (Ionic/Angular)
  app:
    build: .
    ports:
      - "8100:8100"
    volumes:
      - ./:/app # el código del host se refleja en el contenedor (live reload)
      - node_modules:/app/node_modules # node_modules vive en el contenedor
    command: npx ng serve --host 0.0.0.0 --port 8100 --poll 2000
    depends_on:
      - api

  # API REST falsa (json-server) con los datos de db.json
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: node auth-server.js

volumes:
  node_modules:
